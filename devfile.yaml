schemaVersion: 2.3.0
metadata:
  name: workshop-python-kafka
  version: 1.0.0
  description: Grid operations dashboard — wire up sidecars and watch the data flow
attributes:
  che-editor: vscode
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/udi-rhel9:latest
      endpoints:
        - exposure: public
          name: grid-dashboard
          protocol: https
          targetPort: 8080
          path: /
      env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: localhost:9092
        - name: KAFKA_TOPIC
          value: meter-readings
        - name: KAFKA_GROUP_ID
          value: grid-dashboard
      cpuLimit: '2'
      cpuRequest: '500m'
      memoryLimit: '4Gi'
      memoryRequest: '2Gi'
      mountSources: true

  # ---------------------------------------------------------------
  # TODO — Task 1: Add the Kafka sidecar component below this line
  # See the lab guide in docs/index.md for the YAML to paste in.
  # ---------------------------------------------------------------

  # ---------------------------------------------------------------
  # TODO — Task 4: Add the datasette sidecar component below this line
  # See the lab guide in docs/index.md for the YAML to paste in.
  # ---------------------------------------------------------------

  # ---------------------------------------------------------------
  # TODO — Task 6: Add the electricity price sidecar below this line
  # See the lab guide in docs/index.md for the YAML to paste in.
  # ---------------------------------------------------------------

commands:
  - id: 1-install
    exec:
      label: "1. Install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m pip install -r requirements-dev.txt"
      group:
        kind: build
        isDefault: true
  - id: 2-create-topic
    exec:
      label: "2. Create meter-readings topic"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m app.create_topic"
  - id: 3-seed-appliances
    exec:
      label: "3. Seed appliance database"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 data/seed.py"
  - id: 4-test
    exec:
      label: "4. Run tests"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m pytest"
      group:
        kind: test
        isDefault: true
  - id: 5-start
    exec:
      label: "5. Start grid dashboard"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
      group:
        kind: run
        isDefault: true
  - id: 6-build-price-api
    exec:
      label: "6. Build price API image"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        oc apply -f k8s/price-api-build.yaml &&
        oc start-build electricity-price-api --from-dir=sidecar/ --follow &&
        echo "" &&
        echo "============================================" &&
        echo "Add this image to your devfile sidecar:" &&
        echo "image-registry.openshift-image-registry.svc:5000/$(oc project -q)/electricity-price-api:latest" &&
        echo "============================================"
  - id: 7-produce
    exec:
      label: "7. Start meter reading producer"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m app.producer"
