schemaVersion: 2.3.0
metadata:
  name: workshop-python-kafka
  version: 1.0.0
  description: HomeGrid — home energy monitor with AMQ Streams, datasette, and live pricing
attributes:
  che-editor: vscode
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/udi-rhel9:latest
      endpoints:
        - exposure: public
          name: grid-dashboard
          protocol: https
          targetPort: 8080
          path: /
      env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: localhost:9092
        - name: KAFKA_TOPIC
          value: meter-readings
        - name: KAFKA_GROUP_ID
          value: grid-dashboard
      cpuLimit: '2'
      cpuRequest: '500m'
      memoryLimit: '4Gi'
      memoryRequest: '2Gi'
      mountSources: true

  - name: kafka
    container:
      image: apache/kafka:3.9.0
      endpoints:
        - name: kafka-broker
          exposure: internal
          targetPort: 9092
      env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://localhost:9092
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@localhost:9093
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
      cpuLimit: '1'
      memoryLimit: '1Gi'

  - name: datasette
    container:
      image: datasetteproject/datasette
      endpoints:
        - name: datasette
          exposure: internal
          targetPort: 8001
      command: ["datasette", "serve", "/projects/workshop-python-kafka/data/", "--host", "0.0.0.0", "--port", "8001"]
      cpuLimit: '500m'
      memoryLimit: '512Mi'
      mountSources: true

  - name: price-api
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/electricity-price-api:latest
      endpoints:
        - name: price-api
          exposure: internal
          targetPort: 5000
      cpuLimit: '250m'
      memoryLimit: '256Mi'

commands:
  - id: 1-install
    exec:
      label: "1. Install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m pip install -r requirements-dev.txt"
      group:
        kind: build
        isDefault: true
  - id: 2-create-topic
    exec:
      label: "2. Create meter-readings topic"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m app.create_topic"
  - id: 3-seed-appliances
    exec:
      label: "3. Seed appliance database"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 data/seed.py"
  - id: 4-test
    exec:
      label: "4. Run tests"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m pytest"
      group:
        kind: test
        isDefault: true
  - id: 5-start
    exec:
      label: "5. Start grid dashboard"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
      group:
        kind: run
        isDefault: true
  - id: 6-produce
    exec:
      label: "6. Start meter reading producer"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "python3.11 -m app.producer"
